<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre sondage</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #b9e9fa;
    color: #111;
}

.app {
    min-height: 100vh;
    background: #b9e9fa;
}

.header {
    height: 70px;
    background: rgba(255,255,255,0.35);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.header h2 {
    margin: 0;
    font-size: 23px;
}

.back-header {
    position: absolute;
    left: 18px;
    border: none;
    background: transparent;
    font-size: 40px;
    cursor: pointer;
}

.page {
    display: none;
    min-height: calc(100vh - 70px);
    padding: 28px 18px 35px;
    flex-direction: column;
    align-items: center;
}

.page.active {
    display: flex;
}

.step {
    color: #0875b8;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 18px;
}

.penguin-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #25aee9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.penguin {
    font-size: 72px;
}

.question {
    width: 100%;
    max-width: 650px;
    text-align: center;
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 25px;
}

.message-box {
    width: 100%;
    max-width: 650px;
    min-height: 150px;
    border: 1px solid #d3d3d3;
    border-radius: 15px;
    background: white;
    padding: 18px;
    resize: none;
    font-family: Arial, sans-serif;
    font-size: 18px;
    outline: none;
}

.message-box:focus,
.input-box:focus {
    border: 2px solid #149de0;
}

.optional {
    width: 100%;
    max-width: 650px;
    margin-top: 18px;
}

.optional-title {
    color: #527080;
    font-size: 14px;
    margin-bottom: 7px;
}

.input-box {
    width: 100%;
    height: 52px;
    background: white;
    border: 1px solid #d3d3d3;
    border-radius: 12px;
    padding: 0 15px;
    margin-bottom: 10px;
    font-size: 17px;
    outline: none;
}

.buttons {
    width: 100%;
    max-width: 650px;
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.send-button,
.next-button {
    flex: 1;
    height: 56px;
    border: none;
    border-radius: 30px;
    background: #078fe0;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.back-button {
    flex: 0.7;
    height: 56px;
    border: 2px solid #078fe0;
    border-radius: 30px;
    background: white;
    color: #078fe0;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status {
    min-height: 25px;
    margin-top: 15px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
}

.success {
    color: #16854a;
}

.error {
    color: #d62828;
}

.dots {
    display: flex;
    gap: 11px;
    margin-top: 23px;
}

.dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
}

.dot.active {
    background: #078fe0;
}

@media (max-width: 600px) {

    .question {
        font-size: 24px;
    }

    .penguin-circle {
        width: 105px;
        height: 105px;
    }

    .penguin {
        font-size: 62px;
    }
}
</style>
</head>


<body>

<div class="app">

<header class="header">

    <button class="back-header" onclick="headerBack()">
        ‹
    </button>

    <h2>Notre sondage</h2>

</header>


<!-- =========================
     PAGE 1
========================= -->

<section id="page1" class="page active">

    <div class="step">
        Étape 1 sur 3
    </div>

    <div class="penguin-circle">
        <div class="penguin">🐧</div>
    </div>

    <h1 class="question">
        Que souhaitez-vous nous dire ?
    </h1>

    <textarea
        id="message1"
        class="message-box"
        placeholder="Écrivez votre message..."
    ></textarea>

    <div class="optional">

        <div class="optional-title">
            Facultatif
        </div>

        <input
            id="pseudo1"
            class="input-box"
            type="text"
            placeholder="Votre pseudo TikTok"
        >

        <input
            id="contact1"
            class="input-box"
            type="text"
            placeholder="Votre Instagram"
        >

    </div>

    <div class="buttons">

        <button
            id="button1"
            class="send-button"
            onclick="sendPage(1)"
        >
            Envoyer
        </button>

    </div>

    <div id="status1" class="status"></div>

    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</section>


<!-- =========================
     PAGE 2
========================= -->

<section id="page2" class="page">

    <div class="step">
        Étape 2 sur 3
    </div>

    <div class="penguin-circle">
        <div class="penguin">🐧</div>
    </div>

    <h1 class="question">
        Quels sont les lieux que vous aimez visiter ?
    </h1>

    <textarea
        id="message2"
        class="message-box"
        placeholder="Exemple : plage, restaurant, parc..."
    ></textarea>

    <div class="optional">

        <div class="optional-title">
            Facultatif
        </div>

        <input
            id="pseudo2"
            class="input-box"
            type="text"
            placeholder="Votre pseudo TikTok"
        >

        <input
            id="contact2"
            class="input-box"
            type="text"
            placeholder="Votre Instagram"
        >

    </div>

    <div class="buttons">

        <button
            class="back-button"
            onclick="showPage(1)"
        >
            Retour
        </button>

        <button
            id="button2"
            class="send-button"
            onclick="sendPage(2)"
        >
            Envoyer
        </button>

    </div>

    <div id="status2" class="status"></div>

    <div class="dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
    </div>

</section>


<!-- =========================
     PAGE 3
========================= -->

<section id="page3" class="page">

    <div class="step">
        Étape 3 sur 3
    </div>

    <div class="penguin-circle">
        <div class="penguin">🐧</div>
    </div>

    <h1 class="question">
        Qu'est-ce que vous aimez manger ?
    </h1>

    <textarea
        id="message3"
        class="message-box"
        placeholder="Écrivez vos plats préférés..."
    ></textarea>

    <div class="optional">

        <div class="optional-title">
            Facultatif
        </div>

        <input
            id="pseudo3"
            class="input-box"
            type="text"
            placeholder="Votre pseudo TikTok"
        >

        <input
            id="contact3"
            class="input-box"
            type="text"
            placeholder="Votre Instagram"
        >

    </div>

    <div class="buttons">

        <button
            class="back-button"
            onclick="showPage(2)"
        >
            Retour
        </button>

        <button
            id="button3"
            class="send-button"
            onclick="sendPage(3)"
        >
            Envoyer
        </button>

    </div>

    <div id="status3" class="status"></div>

    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
    </div>

</section>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

/*
   REMPLACE SEULEMENT CES DEUX VALEURS
*/

const SUPABASE_URL =
"https://thdzibcychxpzoylatmr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_l0-KT2800OcijbAalZC-zQ_TLLm7OaQ";


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(number) {

    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.remove("active");

        });

    document
        .getElementById("page" + number)
        .classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function headerBack() {

    const activePage =
        document.querySelector(".page.active");

    if (activePage.id === "page1") {

        window.history.back();

    } else if (activePage.id === "page2") {

        showPage(1);

    } else if (activePage.id === "page3") {

        showPage(2);

    }
}


/* =====================================================
   ENVOYER UNE SEULE RÉPONSE
===================================================== */

async function sendPage(page) {

    const message =
        document
        .getElementById("message" + page)
        .value
        .trim();


    const pseudoTikTok =
        document
        .getElementById("pseudo" + page)
        .value
        .trim();


    const contact =
        document
        .getElementById("contact" + page)
        .value
        .trim();


    const status =
        document
        .getElementById("status" + page);


    const button =
        document
        .getElementById("button" + page);


    /* Le message est obligatoire */

    if (!message) {

        status.className =
            "status error";

        status.textContent =
            "Veuillez écrire votre réponse.";

        return;
    }


    /* Désactiver le bouton pendant l'envoi */

    button.disabled = true;

    button.textContent =
        "Envoi...";


    status.className =
        "status";

    status.textContent =
        "Envoi de votre réponse...";


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/support_messages",

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"

                },

                body: JSON.stringify({

                    message:
                        message,

                    pseudo_tiktok:
                        pseudoTikTok || null,

                    contact:
                        contact || null

                })

            }

        );


        /* Vérification Supabase */

        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Erreur Supabase :",
                error
            );

            throw new Error(error);
        }


        /* SUCCÈS */

        status.className =
            "status success";

        status.textContent =
            "Réponse envoyée ✓";


        button.textContent =
            "Envoyé ✓";


        /*
           Passer à la page suivante
           après un court délai.
        */

        if (page < 3) {

            setTimeout(function() {

                showPage(page + 1);

            }, 700);

        }


    } catch (error) {

        console.error(error);


        status.className =
            "status error";

        status.textContent =
            "Impossible d'envoyer votre réponse. Vérifiez Supabase.";


        button.disabled = false;

        button.textContent =
            "Réessayer";
    }
}

</script>

</body>
</html>
